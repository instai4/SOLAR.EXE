<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title> SOLAR.EXE</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
</head>
<body>

<!-- CURSOR -->
<div id="cursor"><div id="cursor-ring"></div><div id="cursor-dot"></div></div>

<!-- LOADING -->
<div id="loading">
  <div class="ld-planets" id="ld-planets"></div>
  <div class="ld-title"> SOLAR.EXE</div>
  <div class="ld-sub">interactive 3d simulation</div>
  <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
  <div class="ld-msg" id="ld-msg">Generating star fields...</div>
</div>

<canvas id="cv"></canvas>
<div id="particles"></div>
<div class="scanline"></div>

<!-- HUD -->
<div id="hud">
  <div class="logo"><span class="logo-emoji"></span>SOLAR.EXE</div>
  <div class="hud-pill hide-mobile">
    <span class="hud-label">Planets</span>
    <span class="hud-value">8</span>
  </div>
  <div class="hud-pill hide-mobile">
    <span class="hud-label">Moons</span>
    <span class="hud-value">20+</span>
  </div>
  <div class="hud-right">
    <div id="speed-pill">
      <label>⏱ Speed</label>
      <input type="range" id="speed-slider" min="0" max="100" value="28">
      <span id="speed-val">1×</span>
    </div>
    <button class="ctrl-btn on" id="orbit-btn" onclick="toggleOrbits()">◎ Orbits</button>
    <button class="ctrl-btn" onclick="showSearch()">🔭 Find</button>
  </div>
</div>

<!-- INFO CARD -->
<div id="info-card">
  <div class="card-outer" id="card-inner"></div>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoom-controls">
  <div class="zoom-btn" onclick="adjustZoom(-0.5)" title="Zoom In">＋</div>
  <div class="zoom-btn" onclick="zoomAll()" title="Reset View">⌂</div>
  <div class="zoom-btn" onclick="adjustZoom(0.5)" title="Zoom Out">−</div>
</div>
<!-- PORTFOLIO -->
<div id="portfolio-bar">
  <a class="port-btn" href="https://instai4.github.io/PORT-FOLIO/" target="_blank">
    <svg viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1"/><line x1="3" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="0.8"/><line x1="3" y1="7" x2="7" y2="7" stroke="currentColor" stroke-width="0.8"/></svg>
    PORTFOLIO
  </a>
  <a class="port-btn" href="https://github.com/instai4" target="_blank">
    <svg viewBox="0 0 12 12" fill="none"><path d="M6 1C3.24 1 1 3.24 1 6c0 2.21 1.43 4.09 3.41 4.75.25.05.34-.11.34-.24v-.85c-1.39.3-1.68-.67-1.68-.67-.23-.58-.56-.74-.56-.74-.45-.31.04-.3.04-.3.5.03.76.51.76.51.44.76 1.16.54 1.44.41.04-.32.17-.54.31-.66-1.11-.13-2.28-.56-2.28-2.47 0-.55.2-1 .52-1.35-.05-.13-.23-.64.05-1.33 0 0 .42-.14 1.38.52.4-.11.83-.17 1.25-.17.42 0 .85.06 1.25.17.96-.66 1.38-.52 1.38-.52.28.69.1 1.2.05 1.33.32.35.52.8.52 1.35 0 1.92-1.17 2.34-2.28 2.47.18.15.34.46.34.93v1.38c0 .13.09.29.34.24C9.57 10.09 11 8.21 11 6c0-2.76-2.24-5-5-5z" fill="currentColor"/></svg>
    GITHUB
  </a>
  <a class="port-btn" href="https://www.linkedin.com/in/anurag-singh-43230a380/" target="_blank">
    <svg viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="0.9"/><rect x="2.5" y="5" width="1.5" height="4.5" fill="currentColor"/><circle cx="3.25" cy="3.25" r="0.75" fill="currentColor"/><path d="M6 5v4.5M6 6.5c0-1 2.5-1.5 2.5 0V9.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
    LINKEDIN
  </a>
</div>

<!-- SEARCH OVERLAY -->
<div id="search-wrap" onclick="this.classList.remove('visible')">
  <div class="search-box" onclick="event.stopPropagation()">
    <div class="search-title">🔭 EXPLORE THE SOLAR SYSTEM</div>
    <div class="search-grid" id="search-grid"></div>
  </div>
</div>

<!-- BOTTOM CAROUSEL -->
<div id="carousel"><div class="carousel-inner" id="carousel-inner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="solar.js"></script>
</body>
</html>
